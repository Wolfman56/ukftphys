[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ukft_sim"
version = "0.1.0"
description = "Universal Knowledge Field Theory - Choice-Guided Bohmian Simulation"
authors = [
  { name = "Grok AI", email = "grok@example.com" },
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.15.0",
]

[project.urls]
"Homepage" = "https://github.com/example/ukftphys"
"Bug Tracker" = "https://github.com/example/ukftphys/issues"
